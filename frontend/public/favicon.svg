<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="rv-shield-bg" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Outer Bezel / Border Gradient -->
    <linearGradient id="rv-border-grad" x1="15" y1="5" x2="105" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="35%" stop-color="#4F46E5" />
      <stop offset="70%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Vault Door Octagon Gradient -->
    <linearGradient id="rv-vault-grad" x1="30" y1="30" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312E81" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.35" />
    </linearGradient>

    <!-- Spark Glow Filter -->
    <filter id="rv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Shield -->
  <ellipse cx="60" cy="58" rx="42" ry="42" fill="#4F46E5" fill-opacity="0.25" filter="url(#rv-glow)" />

  <!-- Base Cryptographic Shield -->
  <path 
    d="M60 12 C78 12 98 19 104 26 C104 56 94 92 60 108 C26 92 16 56 16 26 C22 19 42 12 60 12 Z" 
    fill="url(#rv-shield-bg)" 
    stroke="url(#rv-border-grad)" 
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- Inner Vault Facet Octagon (Vault Door) -->
  <polygon 
    points="60,28 82,37 91,59 82,81 60,90 38,81 29,59 38,37" 
    fill="url(#rv-vault-grad)" 
    stroke="#38BDF8" 
    stroke-width="1.8" 
    stroke-opacity="0.5"
  />

  <!-- Vault Dial Precision Ring -->
  <circle cx="60" cy="59" r="18" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.75" />

  <!-- Diagonal Corner Bolts / Rivets -->
  <circle cx="44" cy="43" r="1.8" fill="#38BDF8" fill-opacity="0.8" />
  <circle cx="76" cy="43" r="1.8" fill="#38BDF8" fill-opacity="0.8" />
  <circle cx="76" cy="75" r="1.8" fill="#38BDF8" fill-opacity="0.8" />
  <circle cx="44" cy="75" r="1.8" fill="#38BDF8" fill-opacity="0.8" />

  <!-- Central Radiant Spark / Star (Diamond Core) -->
  <path 
    d="M60 38 Q60 59 79 59 Q60 59 60 80 Q60 59 41 59 Q60 59 60 38 Z" 
    fill="#FFFFFF" 
    filter="url(#rv-glow)"
  />

  <!-- Center Jewel Core -->
  <circle cx="60" cy="59" r="3.2" fill="#38BDF8" />
  <circle cx="60" cy="59" r="1.2" fill="#FFFFFF" />
</svg>